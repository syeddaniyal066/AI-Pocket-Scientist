<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Pocket Scientist</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="app-layout">

        <!-- =========================
             LEFT SIDE
        ========================== -->

        <div class="main-panel">

            <h1>🤖 AI Pocket Scientist</h1>

            <p class="subtitle">
                Your intelligent science assistant
            </p>

            <input
                type="text"
                id="question"
                placeholder="Ask me anything..."
            >

            <button id="askButton">
                Ask AI
            </button>

            <div id="answer">
                Your answer will appear here...
            </div>

        </div>


        <!-- =========================
             RIGHT SIDE
        ========================== -->

        <div class="image-panel">

            <button id="cameraButton">
                📷 Click Image
            </button>


            <!-- Hidden normal file picker -->

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >


            <!-- IMAGE / CAMERA AREA -->

            <div id="dropZone" class="preview-box">

                <!-- Default message -->

                <div id="placeholder" class="placeholder">

                    <div class="drop-icon">
                        🖼️
                    </div>

                    <div>
                        Drop image here
                    </div>

                    <div class="small-text">
                        or click here to choose image
                    </div>

                </div>


                <!-- Live camera -->

                <video
                    id="cameraVideo"
                    autoplay
                    playsinline
                ></video>


                <!-- Selected / captured image -->

                <img
                    id="previewImage"
                    alt="Image preview"
                >

            </div>


            <!-- CAMERA CONTROLS -->

            <div
                id="cameraControls"
                class="camera-controls"
            >

                <button id="takePhotoButton">
                    📸 Take Photo
                </button>

                <button id="cancelCameraButton">
                    ✖ Cancel
                </button>

            </div>


            <!-- REMOVE IMAGE -->

            <button id="removeImageButton">
                🗑 Remove Image
            </button>


            <!-- Used internally to capture camera frame -->

            <canvas id="cameraCanvas"></canvas>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
